<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tyngdkraft — Append & Review</title>
  
  <!-- PWA Manifest & Meta Mobile -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Tyngdkraft%22%2C%22short_name%22%3A%22Tyngdkraft%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f7f5f0%22%2C%22theme_color%22%3A%22%23f7f5f0%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%3Bcharset%3Dutf-8%2C%253Csvg%2520xmlns%253D%2527http%253A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%253D%25270%25200%2520512%2520512%2527%2520fill%253D%2527%25232c2a29%2527%253E%253Crect%2520width%253D%2527512%2527%2520height%253D%2527512%2527%2520rx%253D%2527120%2527%2520fill%253D%2527%2523f7f5f0%2527%2F%253E%253Cpath%2520d%253D%2527M256%2520120v220m0%25200l-70-70m70%252070l70-70%2527%2520stroke%253D%2527%25232c2a29%2527%2520stroke-width%253D%252740%2527%2520stroke-linecap%253D%2527round%2527%2520stroke-linejoin%253D%2527round%2527%2F%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%2522%7D%5D%7D">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tyngdkraft">

  <!-- Google Fonts: Newsreader (Editorial Serif) & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f5f0;
      --surface: #ffffff;
      --surface-hover: #faf9f6;
      --border: #e3decb;
      --text: #2c2a29;
      --text-muted: #787570;
      --accent: #2c2a29;
      --rescue: #2e7d32;
      --danger: #c62828;
      
      --tag-read-bg: #e0f2fe; --tag-read-txt: #0369a1;
      --tag-watch-bg: #f3e8ff; --tag-watch-txt: #7e22ce;
      --tag-idea-bg: #fef9c3; --tag-idea-txt: #854d0e;
      --tag-todo-bg: #fee2e2; --tag-todo-txt: #991b1b;
      --tag-listen-bg: #dcfce7; --tag-listen-txt: #166534;
      --tag-code-bg: #ffedd5; --tag-code-txt: #9a3412;
      --tag-work-bg: #e0e7ff; --tag-work-txt: #3730a3;
      --tag-custom-bg: #f1f5f9; --tag-custom-txt: #475569;
    }

    [data-theme="dark"] {
      --bg: #141413;
      --surface: #1e1d1b;
      --surface-hover: #262523;
      --border: #33312e;
      --text: #f0eee6;
      --text-muted: #9c988f;
      --accent: #f0eee6;
      --rescue: #4ade80;
      --danger: #f87171;
      
      --tag-read-bg: rgba(56, 189, 248, 0.15); --tag-read-txt: #38bdf8;
      --tag-watch-bg: rgba(168, 85, 247, 0.15); --tag-watch-txt: #c084fc;
      --tag-idea-bg: rgba(250, 204, 21, 0.15); --tag-idea-txt: #facc15;
      --tag-todo-bg: rgba(248, 113, 113, 0.15); --tag-todo-txt: #f87171;
      --tag-listen-bg: rgba(74, 222, 128, 0.15); --tag-listen-txt: #4ade80;
      --tag-code-bg: rgba(251, 146, 60, 0.15); --tag-code-txt: #fb923c;
      --tag-work-bg: rgba(129, 140, 248, 0.15); --tag-work-txt: #818cf8;
      --tag-custom-bg: rgba(148, 163, 184, 0.15); --tag-custom-txt: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.5;
      padding: 16px 12px 90px;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .brand h1 {
      font-family: 'Newsreader', serif;
      font-size: 1.75rem;
      font-weight: 400;
      letter-spacing: -0.5px;
    }

    .brand p {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    button:hover {
      background: var(--surface-hover);
      border-color: var(--text-muted);
    }

    button.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    button.primary:hover { opacity: 0.9; }

    #btnInstall {
      display: none;
      background: var(--rescue);
      color: #fff;
      border-color: var(--rescue);
      font-weight: 600;
    }

    .capture-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Newsreader', serif;
      resize: vertical;
      min-height: 70px;
      outline: none;
    }

    .tag-shortcuts {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 6px;
      scrollbar-width: none;
    }
    .tag-shortcuts::-webkit-scrollbar { display: none; }

    .tag-shortcut-chip {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-hover);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .capture-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-row { display: flex; gap: 8px; }

    .search-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .tags-bar { display: flex; gap: 6px; flex-wrap: wrap; }

    .tag-chip {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 99px;
      cursor: pointer;
      border: 1px solid transparent;
      font-weight: 600;
      user-select: none;
    }
    .tag-chip.inactive { opacity: 0.35; }

    .tag-read   { background: var(--tag-read-bg); color: var(--tag-read-txt); }
    .tag-watch  { background: var(--tag-watch-bg); color: var(--tag-watch-txt); }
    .tag-idea   { background: var(--tag-idea-bg); color: var(--tag-idea-txt); }
    .tag-todo   { background: var(--tag-todo-bg); color: var(--tag-todo-txt); }
    .tag-listen { background: var(--tag-listen-bg); color: var(--tag-listen-txt); }
    .tag-code   { background: var(--tag-code-bg); color: var(--tag-code-txt); }
    .tag-work   { background: var(--tag-work-bg); color: var(--tag-work-txt); }
    .tag-custom { background: var(--tag-custom-bg); color: var(--tag-custom-txt); }

    .stream { display: flex; flex-direction: column; gap: 10px; }

    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      transition: opacity 0.25s, border-color 0.15s;
    }

    .note-card.has-tag-read { border-left-color: var(--tag-read-txt); }
    .note-card.has-tag-watch { border-left-color: var(--tag-watch-txt); }
    .note-card.has-tag-idea { border-left-color: var(--tag-idea-txt); }
    .note-card.has-tag-todo { border-left-color: var(--tag-todo-txt); }
    .note-card.has-tag-listen { border-left-color: var(--tag-listen-txt); }
    .note-card.has-tag-code { border-left-color: var(--tag-code-txt); }
    .note-card.has-tag-work { border-left-color: var(--tag-work-txt); }

    .gravity-0 { opacity: 1; }
    .gravity-1 { opacity: 0.8; }
    .gravity-2 { opacity: 0.55; }
    .gravity-3 { opacity: 0.35; }
    .note-card:hover { opacity: 1 !important; border-color: var(--text-muted); }

    .note-content {
      font-family: 'Newsreader', serif;
      font-size: 1.1rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 10px;
    }

    .prefix-badge {
      display: inline-block;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      margin-right: 6px;
      vertical-align: 1px;
      text-transform: lowercase;
    }

    .note-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-info { display: flex; gap: 6px; align-items: center; }
    .rescued-badge { color: var(--rescue); font-weight: 600; }

    .note-actions { display: flex; gap: 4px; }
    .btn-rescue { color: var(--rescue); font-weight: 600; }
    .btn-rescue:hover { background: rgba(46, 125, 50, 0.1); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: 10px;
      font-family: 'Newsreader', serif;
      font-size: 1.1rem;
    }

    .footer-help {
      margin-top: 30px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <h1>Tyngdkraft</h1>
      <p>Append & Review</p>
    </div>
    <div class="header-actions">
      <button id="btnInstall" title="Installa App">📲 Installa</button>
      <button id="btnThemeToggle" title="Cambia Tema">🌓</button>
      <button id="btnLinkFile" title="Collega file .json locale">🔗 File</button>
      <button id="btnExport" title="Esporta .json">⬇️</button>
      <button id="btnImport" title="Importa .json">⬆️</button>
      <input type="file" id="fileInput" accept=".json" style="display:none">
    </div>
  </header>

  <div class="capture-box">
    <div class="tag-shortcuts">
      <span class="tag-shortcut-chip" onclick="insertTag('idea:')">idea:</span>
      <span class="tag-shortcut-chip" onclick="insertTag('todo:')">todo:</span>
      <span class="tag-shortcut-chip" onclick="insertTag('read:')">read:</span>
      <span class="tag-shortcut-chip" onclick="insertTag('watch:')">watch:</span>
      <span class="tag-shortcut-chip" onclick="insertTag('listen:')">listen:</span>
      <span class="tag-shortcut-chip" onclick="insertTag('code:')">code:</span>
      <span class="tag-shortcut-chip" onclick="insertTag('work:')">work:</span>
    </div>
    <textarea id="noteInput" placeholder="Scrivi un pensiero... (Premi Invio due volte o Ctrl+Invio)"></textarea>
    <div class="capture-footer">
      <span id="fileSyncBadge">Locale</span>
      <button class="primary" id="btnAdd">Aggiungi ↑</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Cerca nel flusso...">
      <button id="btnToggleArchive">📦 (0)</button>
    </div>
    <div class="tags-bar" id="tagsBar"></div>
  </div>

  <div class="stream" id="notesStream"></div>

  <div class="footer-help">
    Tyngdkraft · Salvataggio automatico locale & PWA offline
  </div>
</div>

<script>
  // Registrazione Service Worker per cache offline
  if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));`;
    const swBlob = new Blob([swCode], {type: 'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }

  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btnInstall').style.display = 'inline-flex';
  });

  document.getElementById('btnInstall').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      document.getElementById('btnInstall').style.display = 'none';
    }
    deferredPrompt = null;
  });

  const STORAGE_KEY = 'tyngdkraft_notes_v1';
  let notes = [];
  let activeTag = null;
  let showArchived = false;
  let fileHandle = null;

  const KNOWN_TAGS = ['read', 'watch', 'idea', 'todo', 'listen', 'code', 'work'];

  function init() {
    const savedTheme = localStorage.getItem('tyngdkraft_theme') || 'light';
    setTheme(savedTheme);

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try { notes = JSON.parse(saved); } catch(e) { notes = []; }
    } else {
      const now = Date.now(), d = 86400000;
      notes = [
        { id: '1', text: 'idea: Strutturare il flusso di note giornaliero con il metodo Append-and-Review', createdAt: now - (d*2), lastRescuedAt: now - 300000, rescueCount: 1, archived: false },
        { id: '2', text: 'read: Saggio sulla concentrazione e la memoria di lavoro', createdAt: now - (d*15), lastRescuedAt: now - (d*15), rescueCount: 0, archived: false }
      ];
      saveNotes();
    }
    render();
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('tyngdkraft_theme', theme);
    document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#141413' : '#f7f5f0';
  }

  document.getElementById('btnThemeToggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    setTheme(current === 'dark' ? 'light' : 'dark');
  });

  async function saveNotes() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    if (fileHandle) {
      try {
        const w = await fileHandle.createWritable();
        await w.write(JSON.stringify(notes, null, 2));
        await w.close();
      } catch(e) { console.error(e); }
    }
  }

  function parsePrefix(text) {
    const match = text.match(/^([a-zA-Z0-9_-]+):\s*(.*)$/s);
    if (!match) return { prefix: null, body: text, tagClass: '' };
    const prefix = match[1].toLowerCase();
    const body = match[2];
    const tagClass = KNOWN_TAGS.includes(prefix) ? `tag-${prefix}` : 'tag-custom';
    return { prefix, body, tagClass };
  }

  function getGravityClass(timestamp) {
    const ageDays = (Date.now() - timestamp) / (1000 * 60 * 60 * 24);
    if (ageDays > 45) return 'gravity-3';
    if (ageDays > 14) return 'gravity-2';
    if (ageDays > 3)  return 'gravity-1';
    return 'gravity-0';
  }

  function timeAgo(ts) {
    const sec = Math.floor((Date.now() - ts) / 1000);
    if (sec < 60) return 'ora';
    const min = Math.floor(sec / 60);
    if (min < 60) return `${min}m fa`;
    const hrs = Math.floor(min / 60);
    if (hrs < 24) return `${hrs}h fa`;
    const days = Math.floor(hrs / 24);
    if (days < 30) return `${days}g fa`;
    return `${Math.floor(days / 30)} mesi fa`;
  }

  function addNote(rawText) {
    const text = rawText.trim();
    if (!text) return;
    const now = Date.now();
    notes.unshift({
      id: now.toString(36) + Math.random().toString(36).substr(2, 4),
      text, createdAt: now, lastRescuedAt: now, rescueCount: 0, archived: false
    });
    saveNotes();
    render();
  }

  window.insertTag = function(prefix) {
    const input = document.getElementById('noteInput');
    input.value = prefix + ' ' + input.value;
    input.focus();
  };

  window.rescueNote = function(id) {
    const idx = notes.findIndex(n => n.id === id);
    if (idx === -1) return;
    const note = notes[idx];
    note.lastRescuedAt = Date.now();
    note.rescueCount = (note.rescueCount || 0) + 1;
    note.archived = false;
    notes.splice(idx, 1);
    notes.unshift(note);
    saveNotes();
    render();
  };

  window.editNote = function(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    const updated = prompt('Modifica nota:', note.text);
    if (updated !== null && updated.trim() !== '') {
      note.text = updated.trim();
      saveNotes();
      render();
    }
  };

  window.toggleArchiveNote = function(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    note.archived = !note.archived;
    saveNotes();
    render();
  };

  window.deleteNote = function(id) {
    if (!confirm('Eliminare definitivamente?')) return;
    notes = notes.filter(n => n.id !== id);
    saveNotes();
    render();
  };

  function getFilteredNotes() {
    const q = document.getElementById('searchInput').value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    return [...notes].sort((a,b) => b.lastRescuedAt - a.lastRescuedAt).filter(n => {
      if (Boolean(n.archived) !== showArchived) return false;
      const { prefix } = parsePrefix(n.text);
      if (activeTag && prefix !== activeTag) return false;
      if (q && !n.text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").includes(q)) return false;
      return true;
    });
  }

  function renderTagsBar() {
    const tagsBar = document.getElementById('tagsBar');
    const counts = {};
    notes.filter(n => Boolean(n.archived) === showArchived).forEach(n => {
      const { prefix } = parsePrefix(n.text);
      if (prefix) counts[prefix] = (counts[prefix] || 0) + 1;
    });
    const tags = Object.keys(counts).sort();
    if (tags.length === 0) { tagsBar.innerHTML = ''; return; }
    tagsBar.innerHTML = tags.map(t => {
      const cls = KNOWN_TAGS.includes(t) ? `tag-${t}` : 'tag-custom';
      const inactive = (activeTag && activeTag !== t) ? 'inactive' : '';
      return `<span class="tag-chip ${cls} ${inactive}" onclick="toggleTagFilter('${t}')">${t}: (${counts[t]})</span>`;
    }).join('');
  }

  window.toggleTagFilter = function(tag) {
    activeTag = (activeTag === tag) ? null : tag;
    render();
  };

  function render() {
    renderTagsBar();
    const archivedCount = notes.filter(n => n.archived).length;
    const btnArch = document.getElementById('btnToggleArchive');
    btnArch.textContent = showArchived ? `⬅️ Flusso` : `📦 (${archivedCount})`;

    const list = getFilteredNotes();
    const stream = document.getElementById('notesStream');

    if (list.length === 0) {
      stream.innerHTML = `<div class="empty-state">Nessuna nota trovata.</div>`;
      return;
    }

    stream.innerHTML = list.map(n => {
      const { prefix, body, tagClass } = parsePrefix(n.text);
      const gravClass = getGravityClass(n.lastRescuedAt);
      const cardTagClass = prefix ? `has-tag-${prefix}` : '';
      const prefixHtml = prefix ? `<span class="prefix-badge ${tagClass}">${prefix}:</span>` : '';
      const rescueInfo = n.rescueCount > 0 ? `<span class="rescued-badge">↑ salvata ${timeAgo(n.lastRescuedAt)} (${n.rescueCount}x)</span> · ` : '';

      return `
        <div class="note-card ${gravClass} ${cardTagClass}">
          <div class="note-content">${prefixHtml}${escapeHtml(body)}</div>
          <div class="note-meta">
            <div class="meta-info">${rescueInfo}<span>scritta ${timeAgo(n.createdAt)}</span></div>
            <div class="note-actions">
              <button class="btn-rescue" onclick="rescueNote('${n.id}')">↑ Rescue</button>
              <button onclick="editNote('${n.id}')">✎</button>
              <button onclick="toggleArchiveNote('${n.id}')">${n.archived ? '📤' : '📦'}</button>
              <button onclick="deleteNote('${n.id}')">✕</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  const noteInput = document.getElementById('noteInput');
  let lastEnter = 0;
  noteInput.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault(); addNote(noteInput.value); noteInput.value = '';
    } else if (e.key === 'Enter' && !e.shiftKey) {
      const now = Date.now();
      if (now - lastEnter < 400 && noteInput.value.trim().length > 0) {
        e.preventDefault(); addNote(noteInput.value); noteInput.value = ''; lastEnter = 0;
      } else { lastEnter = now; }
    }
  });

  document.getElementById('btnAdd').addEventListener('click', () => {
    addNote(noteInput.value); noteInput.value = ''; noteInput.focus();
  });

  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('btnToggleArchive').addEventListener('click', () => {
    showArchived = !showArchived; render();
  });

  document.getElementById('btnLinkFile').addEventListener('click', async () => {
    if (!('showSaveFilePicker' in window)) { alert('Usa Chrome o Edge per il collegamento diretto al file su disco.'); return; }
    try {
      fileHandle = await window.showSaveFilePicker({ suggestedName: 'tyngdkraft.json', types: [{description: 'JSON', accept: {'application/json': ['.json']}}] });
      await saveNotes();
      document.getElementById('fileSyncBadge').textContent = `File: ${fileHandle.name}`;
    } catch(e) {}
  });

  document.getElementById('btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(notes, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `tyngdkraft-${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (Array.isArray(imported)) {
          if (confirm('Vuoi sostituire le note attuali (OK) o unirle (Annulla)?')) {
            notes = imported;
          } else {
            notes = [...imported, ...notes];
          }
          saveNotes(); render();
        }
      } catch(err) { alert('File non valido.'); }
    };
    r.readAsText(f);
  });

  init();
</script>
</body>
</html>
